name: Build and deploy

on:
  workflow_dispatch:
  schedule:
    # A backstop only. GitHub's scheduler has been unreliable on these repos --
    # see the sibling mlb-wind notes -- so treat dispatch as the real trigger.
    #
    # GitHub cron is UTC and has no timezone option, so this cannot track
    # Central across DST the way the real cron-job.org trigger does. It does
    # not need to: at a two-hour cadence an hour of seasonal drift changes
    # nothing, and this only ever fires when the external trigger has failed.
    - cron: "20 */2 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cheap, offline, and it fails the build before a broken model can be
      # published. The ledger's "never record a started match" rule is in here.
      - name: Self-test
        run: |
          python3 selftest.py

      - name: Build pages
        env:
          # DraftKings prices for the matches page. dk.py spends this only
          # when data/dk_odds.json is due a refresh -- about twice a day --
          # because the free allowance is 500 requests a month.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 build.py --out public

      - name: Freeze predictions and score finished matches
        run: |
          python3 ledger.py --all --out public/accuracy.html

      - name: Commit ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The DraftKings price cache rides along: it is the only way a
          # refresh made by this run is still known to the next one, and
          # without it every run would spend a request.
          git add ledger/picks.json data/dk_odds.json 2>/dev/null || git add ledger/picks.json
          git diff --staged --quiet && exit 0
          # [skip ci] or this commit triggers another build, forever.
          git commit -m "ledger: record and score [skip ci]"
          # The build takes minutes and races with any other push. Take the
          # newer main and re-derive on top; record and score are idempotent.
          # This run's price cache is the newest there is, so it is carried
          # across the reset rather than thrown away with it.
          for i in 1 2 3; do
            git push && exit 0
            cp data/dk_odds.json "$RUNNER_TEMP/dk_odds.json" 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/dk_odds.json" data/dk_odds.json 2>/dev/null || true
            python3 ledger.py --all >/dev/null
            git add ledger/picks.json data/dk_odds.json 2>/dev/null || git add ledger/picks.json
            git diff --staged --quiet && exit 0
            git commit -m "ledger: record and score [skip ci]"
          done
          # Never fail the build for this -- the pages must still deploy.
          echo "ledger push failed after retries" >&2

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
